# Her gün videoyu üretir, GitHub Pages ile herkese açık adrese koyar ve Instagram'a paylaşır.
name: Günlük Reels

on:
  # Saatler UTC'dir; Türkiye saati = UTC + 3. GitHub zamanlanmış çalışmaları birkaç dakika geciktirebilir.
  # Saatler, 9,6 milyon gönderilik Buffer analizindeki en yüksek etkileşim saatlerine göre seçildi.
  # Her gün iki paylaşım: sabah bilgilendirme listesi (fotoğraf + maddeler), akşam video.
  # ÖNEMLİ: sabah saatlerini değiştirirsen aşağıdaki "Paylaşım türünü belirle" adımındaki listeyi de güncelle.
  schedule:
    # Sabah bilgilendirme
    - cron: "47 5 * * 1,2,4"   # Pazartesi, Salı, Perşembe 08:47 (TR)
    - cron: "47 4 * * 3"       # Çarşamba                  07:47 (TR)
    - cron: "47 2 * * 5"       # Cuma                      05:47 (TR)
    - cron: "47 6 * * 6,0"     # Cumartesi, Pazar          09:47 (TR)
    # Akşam video
    - cron: "47 15 * * 1,2,4"  # Pazartesi, Salı, Perşembe 18:47 (TR)
    - cron: "47 14 * * 3"      # Çarşamba                  17:47 (TR)
    - cron: "47 17 * * 5,6,0"  # Cuma, Cumartesi, Pazar    20:47 (TR)
  workflow_dispatch:         # Actions sekmesinden elle de çalıştırılabilir
    inputs:
      tur:
        description: "Paylaşım türü"
        type: choice
        options: [video, sabah]
        default: video

permissions:
  contents: write   # konu geçmişini depoya kaydetmek için
  pages: write
  id-token: write

concurrency:
  group: gunluk-reels
  cancel-in-progress: false

jobs:
  uret-ve-paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg ve yazı tipleri kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter

      - name: Paketleri kur
        run: pip install -r requirements.txt

      # Animasyonlu anlatım: sahneler Chromium'da çizilip kare kare videoya çevrilir.
      - name: Animasyon tarayıcısı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Animasyon tarayıcısını kur
        run: python -m playwright install --with-deps chromium

      # Kendi sesinle seslendirme açıksa (Settings > Secrets and variables > Actions > Variables: SES_MOTORU=klon)
      - name: Ses modeli önbelleği
        if: vars.SES_MOTORU == 'klon'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-modeli-v1

      - name: Kendi ses modelini kur
        if: vars.SES_MOTORU == 'klon'
        run: pip install chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Paylaşım türünü belirle
        run: |
          case "${{ github.event.schedule }}" in
            "47 5 * * 1,2,4"|"47 4 * * 3"|"47 2 * * 5"|"47 6 * * 6,0") TUR=sabah ;;
            "") TUR="${{ inputs.tur || 'video' }}" ;;
            *) TUR=video ;;
          esac
          echo "TUR=$TUR" >> "$GITHUB_ENV"
          echo "Paylaşım türü: $TUR"

      - name: Videoyu üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SES_MOTORU: ${{ vars.SES_MOTORU }}
          SES_SIFRESI: ${{ secrets.SES_SIFRESI }}
        run: |
          if [ "$TUR" = "sabah" ]; then python calistir.py --sabah; else python calistir.py; fi

      - name: Yayın klasörünü hazırla
        run: |
          KLASOR=$(ls -d cikti/*/ | sort | tail -n 1)
          AD="video-$(date -u +%Y%m%d-%H%M%S).mp4"
          mkdir -p yayin
          cp "${KLASOR}video.mp4" "yayin/$AD"
          echo "KLASOR=$KLASOR" >> "$GITHUB_ENV"
          echo "VIDEO_AD=$AD" >> "$GITHUB_ENV"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: yayin

      - id: yayin
        uses: actions/deploy-pages@v4

      - name: Instagram'a paylaş
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python paylas.py --video-url "${{ steps.yayin.outputs.page_url }}${VIDEO_AD}" --aciklama "${KLASOR}aciklama.txt"

      - name: Konu geçmişini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/gecmis.json veri/sabah_gecmis.json 2>/dev/null || git add veri/gecmis.json
          git commit -m "Konu geçmişi ($TUR): $(date -u +%Y-%m-%d)" || echo "Değişiklik yok"
          git pull --rebase && git push

      - name: Videoyu indirilebilir sakla (7 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: cikti/
          retention-days: 7
